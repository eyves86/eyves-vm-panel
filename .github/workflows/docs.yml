name: deploy-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GitHub Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一仓库只允许一个文档部署并发进行
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build documentation site
        run: |
          cd docs
          npm ci
          # 项目站点(base path 为仓库名)；若改为用户/组织站点请去掉 --base 参数
          npx vitepress build . --base /eyves-vm-panel/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4