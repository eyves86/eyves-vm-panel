name: build-release

# 打 tag（v*）即自动发版：构建 amd64/arm64 → 生成 SHA256SUMS → ed25519 签名 →
# 发布 GitHub Release（+ 镜像到 Codeberg）。也可用 workflow_dispatch 手动跑
# dry-run（只构建/签名/验签，不上传任何 Release）。
#
# 必需仓库 Secret：
#   EYVESCLOUD_SIGNING_KEY  ed25519 私钥 seed（32B hex，releasetool keygen 生成）
#   CODEBERG_TOKEN          可选，Codeberg 令牌（write:repository），配了才镜像
# 可选仓库变量：
#   EYVESCLOUD_RELEASE_PUBKEY  发布公钥（minisign 信封 base64），默认内置官方值
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只构建/签名/验签并留构建产物，不发布 Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      # F-7：发布公钥（minisign 信封第二行 base64）编译期内嵌，供面板「自升级」
      # 对 SHA256SUMS 做 ed25519 验签。必须在**这里**注入——安装脚本侧有内置
      # 默认公钥，但面板二进制若不带 releasePubKeyHex，自升级会视为「开发构建」
      # 静默跳过验签，签名资产形同虚设。默认值与 install.sh 内置一致。
      EYVESCLOUD_RELEASE_PUBKEY: ${{ vars.EYVESCLOUD_RELEASE_PUBKEY || 'Xyv7jh+bDXBzIf57+PhyfzCUsfEPOIuyUog/j6burGI=' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (embeds into Go binary)
        run: |
          cd frontend
          npm ci
          npm run build
          # 与 build.sh 一致：先清空 embed 目录再拷入，避免仓库里残留的旧 hash 资源
          # 被打进二进制（index.html 会覆盖，旧 assets 不会）。
          rm -rf ../backend/internal/server/web
          mkdir -p ../backend/internal/server/web
          cp -r dist/* ../backend/internal/server/web/
          touch ../backend/internal/server/web/.gitkeep

      - name: Build backend (${{ matrix.arch }})
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="0.0.0-dev+${GITHUB_SHA:0:7}"
          fi
          echo "构建版本：${VERSION}"
          cd backend
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w -X eyvescloud/internal/version.Version=${VERSION} -X eyvescloud/internal/cli.releasePubKeyHex=${EYVESCLOUD_RELEASE_PUBKEY}" \
            -o ../dist/eyvescloud-linux-${{ matrix.arch }} .

      - name: Package release assets
        run: |
          set -e
          ASSET_DIR="eyvescloud-linux-${{ matrix.arch }}"
          PKG="dist/package-${{ matrix.arch }}"
          mkdir -p "$PKG/$ASSET_DIR"
          cp "dist/$ASSET_DIR" "$PKG/$ASSET_DIR/eyvescloud"
          cp install.sh "$PKG/$ASSET_DIR/install.sh" 2>/dev/null || true
          chmod +x "$PKG/$ASSET_DIR/eyvescloud"
          tar -C "$PKG" -czf "dist/$ASSET_DIR.tar.gz" "$ASSET_DIR"
          # 生成产物校验值：安装/升级路径会强制校验（见 install.sh verify_release_asset
          # 与 internal/cli 的 verifyReleaseArchive）。
          # 只发布 .tar.gz（内含二进制）与校验清单：裸二进制与 tarball 内容重复，
          # 全量上传会快速耗尽 Forgejo 实例的发布资产配额（实测 413 quota exceeded）。
          ( cd dist && sha256sum "$ASSET_DIR.tar.gz" > "$ASSET_DIR.sha256" )
          cat "dist/$ASSET_DIR.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: eyvescloud-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/eyvescloud-linux-${{ matrix.arch }}.tar.gz
            dist/eyvescloud-linux-${{ matrix.arch }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secret 走 env 注入，不再用 ${{ secrets.X }} 内联进 run 脚本：内联会把明文
      # 写进生成脚本（调试日志可能回显）。job 级 if 不支持 env 上下文，故 dry-run
      # 判断放在 step 级 if 上。
      EYVESCLOUD_SIGNING_KEY: ${{ secrets.EYVESCLOUD_SIGNING_KEY }}
      EYVESCLOUD_RELEASE_PUBKEY: ${{ vars.EYVESCLOUD_RELEASE_PUBKEY || 'Xyv7jh+bDXBzIf57+PhyfzCUsfEPOIuyUog/j6burGI=' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build SHA256SUMS + ed25519 签名 + 自检
        run: |
          set -e
          cd artifacts
          # 汇总所有架构产物 + 单文件校验值，供安装/升级路径强制校验。
          cat */*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          if [ -z "${EYVESCLOUD_SIGNING_KEY:-}" ]; then
            echo "::error::未配置 EYVESCLOUD_SIGNING_KEY Secret，拒绝产出无签名 release（升级器会拒绝验签）"
            exit 1
          fi
          printf '%s\n' "$EYVESCLOUD_SIGNING_KEY" | tr -d '[:space:]' > "$RUNNER_TEMP/signing.key"
          ( cd ../backend && go run ./cmd/releasetool sign \
              -key "$(cat "$RUNNER_TEMP/signing.key")" \
              -in ../artifacts/SHA256SUMS ) > ../artifacts/SHA256SUMS.minisig
          rm -f "$RUNNER_TEMP/signing.key"
          cp SHA256SUMS.minisig SHA256SUMS.minisign   # 兼容历史命名
          # 自检：用发布公钥复核签名。私钥与安装器/升级器内置公钥不一致时立即失败，
          # 否则会产出一个所有客户端都拒绝验签的「坏 release」。
          ( cd ../backend && go run ./cmd/releasetool verify \
              -pub "$EYVESCLOUD_RELEASE_PUBKEY" \
              -in ../artifacts/SHA256SUMS \
              -sig ../artifacts/SHA256SUMS.minisig )
          echo "签名完成，并已用内置发布公钥复核通过"

      - name: Publish
        if: ${{ inputs.dry_run != true && hashFiles('artifacts/SHA256SUMS.minisig') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true

      - name: Publish signature asset
        if: ${{ inputs.dry_run != true && hashFiles('artifacts/SHA256SUMS.minisig') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SHA256SUMS.minisig

  release-codeberg:
    name: Publish Codeberg Release
    needs: build
    runs-on: ubuntu-latest
    # 官方镜像：同一批产物同步发布到 Codeberg（Forgejo）。配 CODEBERG_TOKEN
    # （Codeberg 设置 → 应用 → 令牌，需 write:repository）后生效。
    # 说明：job 级 if 不支持 env 上下文（GitHub 会把整个 workflow 判为「无效文件」，
    # 表现为运行记录名为文件路径且 0 个 job）。故「是否有 token」「是否 dry-run」
    # 的判断都下放到 step 级 if。
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      EYVESCLOUD_SIGNING_KEY: ${{ secrets.EYVESCLOUD_SIGNING_KEY }}
      EYVESCLOUD_RELEASE_PUBKEY: ${{ vars.EYVESCLOUD_RELEASE_PUBKEY || 'Xyv7jh+bDXBzIf57+PhyfzCUsfEPOIuyUog/j6burGI=' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build SHA256SUMS
        run: |
          set -e
          cd artifacts
          cat */*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          # F-7：同 GitHub 侧，对清单做 ed25519 签名（Secret EYVESCLOUD_SIGNING_KEY）。
          if [ -n "${EYVESCLOUD_SIGNING_KEY:-}" ]; then
            printf '%s\n' "$EYVESCLOUD_SIGNING_KEY" | tr -d '[:space:]' > "$RUNNER_TEMP/signing.key"
            ( cd ../backend && go run ./cmd/releasetool sign -key "$(cat "$RUNNER_TEMP/signing.key")" -in ../artifacts/SHA256SUMS > ../artifacts/SHA256SUMS.minisig )
            rm -f "$RUNNER_TEMP/signing.key"
            cp SHA256SUMS.minisig SHA256SUMS.minisign
            ( cd ../backend && go run ./cmd/releasetool verify -pub "$EYVESCLOUD_RELEASE_PUBKEY" -in ../artifacts/SHA256SUMS -sig ../artifacts/SHA256SUMS.minisig )
            echo "SHA256SUMS.minisig 已生成并通过复核"
          else
            echo "::warning::未配置 EYVESCLOUD_SIGNING_KEY Secret，跳过签名"
          fi

      - name: Publish to Codeberg
        if: ${{ env.CODEBERG_TOKEN != '' && inputs.dry_run != true }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          API="https://codeberg.org/api/v1/repos/fenhaolost/eyves-vm-panel"
          # 创建（或复用）release，然后逐个上传产物。带 target_commitish 以便
          # tag 尚未推到 Codeberg 时由 API 直接建 tag，省掉额外的 push 步骤。
          payload="$(printf '{"tag_name":"%s","name":"%s","target_commitish":"%s","draft":false,"prerelease":false}' "$TAG" "$TAG" "$GITHUB_SHA")"
          curl -fsSL -X POST "$API/releases" \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" >/dev/null || true
          # 取首个 "id"（release id）。不能用贪婪 sed 's/.*"id":.../'：单行 JSON 里
          # 末尾还有 author.id，会取错。
          id="$(curl -fsSL "$API/releases/tags/$TAG" -H "Authorization: token $CODEBERG_TOKEN" | grep -oE '"id"[[:space:]]*:[[:space:]]*[0-9]+' | head -n 1 | grep -oE '[0-9]+')"
          [ -n "$id" ] || { echo "无法获取 Codeberg release id"; exit 1; }
          for f in $(find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name 'SHA256SUMS' -o -name 'SHA256SUMS.minisig' -o -name 'SHA256SUMS.minisign' \)); do
            echo "upload $f"
            curl -fsSL -X POST "$API/releases/$id/assets?name=$(basename "$f")" \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" >/dev/null
          done
