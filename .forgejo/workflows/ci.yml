# Codeberg（Forgejo Actions）质量门禁。
#
# 为什么放在 .forgejo/ 而不是 .github/：
# 本仓库的远端是 codeberg.org，Codeberg 只读取 .forgejo/workflows/。
# 此前只有 .github/workflows/（build-release.yml、docs.yml），意味着
# **Codeberg 上的 CI 从未运行过**——发版一直靠人工。
#
# 这个工作流只做一件事：让「已经修过的缺陷」不可能悄悄回来。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 关键契约自检：纯 grep，秒级完成，先跑（失败最快给出信号）。
  #
  # 每条断言都对应一个真实修过的缺陷，而它们**都不会被编译或常规测试发现**：
  #   - v2 CSRF 守卫缺失
  #   - 节点心跳 token 非常量时间比较
  #   - 限流桶键含攻击者可控输入（可轮换绕过）
  #   - 安全组配置不落库 / 无下发实现
  #   - 容器列表无锁直取全局切片（数据竞态）
  #   - 配置落库失败被静默吞掉
  contracts:
    name: 关键契约自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 防止已修缺陷退化
        run: bash scripts/ci-check.sh --contracts-only

  backend:
    name: 后端（vet / test -race / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # -race 是本项目最值钱的一项检查：数据竞态只在这里暴露，
      # 曾经从 5 处竞态修到 0 处，必须防止回退。
      - name: go test -race
        working-directory: backend
        run: go test -race ./internal/... -count=1

      - name: go test
        working-directory: backend
        run: go test ./internal/... -count=1

      - name: go build
        working-directory: backend
        run: go build ./...

  frontend:
    name: 前端（tsc / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit

      - name: build
        working-directory: frontend
        run: npm run build
