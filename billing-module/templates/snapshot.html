<style>
.eyvescloud-snap-panel{font-size:14px;color:#1f2937}
.eyvescloud-snap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.eyvescloud-snap-card{border:1px solid #e5e7eb;border-radius:6px;padding:12px;background:#fff}
.eyvescloud-snap-label{color:#6b7280;font-size:12px;margin-bottom:4px}
.eyvescloud-snap-value{font-size:18px;font-weight:600;word-break:break-all}
.eyvescloud-snap-title{font-weight:600;margin:18px 0 8px}
.eyvescloud-snap-muted{color:#6b7280}
.eyvescloud-snap-form{border:1px solid #e5e7eb;border-radius:6px;background:#fff;padding:12px;margin-top:8px}
.eyvescloud-snap-actions{display:flex;gap:8px;flex-wrap:wrap}
.eyvescloud-snap-btn{height:34px;border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:4px;padding:0 12px;cursor:pointer}
.eyvescloud-snap-btn[disabled]{opacity:.6;cursor:not-allowed}
.eyvescloud-snap-btn-secondary{border-color:#d1d5db;background:#fff;color:#374151}
.eyvescloud-snap-btn-danger{border-color:#dc2626;background:#dc2626;color:#fff}
.eyvescloud-snap-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.eyvescloud-snap-item{border:1px solid #e5e7eb;border-radius:6px;background:#fff;padding:12px}
.eyvescloud-snap-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:center}
.eyvescloud-snap-msg{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:10px 12px;margin-bottom:12px;display:none}
.eyvescloud-snap-msg.error{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
.eyvescloud-snap-modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.eyvescloud-snap-modal{width:min(420px,100%);background:#fff;border-radius:6px;border:1px solid #e5e7eb;box-shadow:0 18px 48px rgba(15,23,42,.22);padding:16px}
.eyvescloud-snap-modal-title{font-size:16px;font-weight:700;color:#111827;margin-bottom:8px}
.eyvescloud-snap-modal-body{font-size:14px;color:#4b5563;line-height:1.6;margin-bottom:14px}
.eyvescloud-snap-modal-actions{display:flex;justify-content:flex-end;gap:8px}
</style>

<div class="eyvescloud-snap-panel" id="eyvescloud-snap-panel" data-service-id="{$service_id}" data-area-key="{$area_key}">
    <div class="eyvescloud-snap-msg" id="eyvescloud-snap-msg"></div>

    <div class="eyvescloud-snap-grid">
        <div class="eyvescloud-snap-card">
            <div class="eyvescloud-snap-label">实例名称</div>
            <div class="eyvescloud-snap-value">{$container_name}</div>
        </div>
        <div class="eyvescloud-snap-card">
            <div class="eyvescloud-snap-label">快照配额</div>
            <div class="eyvescloud-snap-value" id="eyvescloud-snap-quota">-</div>
        </div>
    </div>

    <div class="eyvescloud-snap-title">创建快照</div>
    <div class="eyvescloud-snap-form">
        <div class="eyvescloud-snap-actions">
            <button class="eyvescloud-snap-btn" type="button" data-eyvescloud-action="create">创建快照</button>
        </div>
        <div class="eyvescloud-snap-muted" style="margin-top:8px">快照用于保存当前磁盘状态，可用于快速还原。</div>
    </div>

    <div class="eyvescloud-snap-title">已有快照</div>
    <div id="eyvescloud-snap-list" class="eyvescloud-snap-list">
        <div class="eyvescloud-snap-form eyvescloud-snap-muted">正在加载…</div>
    </div>

    <div class="eyvescloud-snap-modal-mask" id="eyvescloud-snap-modal-mask">
        <div class="eyvescloud-snap-modal">
            <div class="eyvescloud-snap-modal-title" id="eyvescloud-snap-modal-title">确认操作</div>
            <div class="eyvescloud-snap-modal-body" id="eyvescloud-snap-modal-body"></div>
            <div class="eyvescloud-snap-modal-actions">
                <button class="eyvescloud-snap-btn eyvescloud-snap-btn-secondary" type="button" id="eyvescloud-snap-cancel">取消</button>
                <button class="eyvescloud-snap-btn" type="button" id="eyvescloud-snap-confirm">确认</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    var panel = document.getElementById('eyvescloud-snap-panel');
    if (!panel || panel.getAttribute('data-bound') === '1') return;
    panel.setAttribute('data-bound', '1');

    var msg = document.getElementById('eyvescloud-snap-msg');
    var list = document.getElementById('eyvescloud-snap-list');
    var quota = document.getElementById('eyvescloud-snap-quota');
    var mask = document.getElementById('eyvescloud-snap-modal-mask');
    var pending = null;
    var maskText = document.getElementById('eyvescloud-snap-modal-body');
    var cancelBtn = document.getElementById('eyvescloud-snap-cancel');
    var confirmBtn = document.getElementById('eyvescloud-snap-confirm');

    function endpoint(){ return "{$MODULE_CUSTOM_API}"; }
    function escapeHtml(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function show(type, text){ msg.className = 'eyvescloud-snap-msg'+(type==='error'?' error':''); msg.style.display='block'; msg.textContent = text||''; }

    function render(items){
        if(!Array.isArray(items) || items.length===0){
            list.innerHTML = '<div class="eyvescloud-snap-form eyvescloud-snap-muted">暂无快照</div>';
            return;
        }
        list.innerHTML = items.map(function(s){
            var id = escapeHtml(s.id||'');
            var created = escapeHtml(s.created_at||'-');
            var size = escapeHtml(s.size_text||'-');
            var by = escapeHtml(s.created_by||'-');
            return '<div class="eyvescloud-snap-item" data-id="'+id+'">'+
                '<div class="eyvescloud-snap-row">'+
                '<div><div class="eyvescloud-snap-label">快照 ID</div><div class="eyvescloud-snap-value">'+id+'</div></div>'+
                '<div><div class="eyvescloud-snap-label">创建时间</div><div>'+created+'</div></div>'+
                '<div><div class="eyvescloud-snap-label">大小</div><div>'+size+'</div></div>'+
                '<div><div class="eyvescloud-snap-label">创建者</div><div>'+by+'</div></div>'+
                '<div class="eyvescloud-snap-actions">'+
                '<button class="eyvescloud-snap-btn eyvescloud-snap-btn-secondary" type="button" data-snap-action="restore">还原</button>'+
                '<button class="eyvescloud-snap-btn eyvescloud-snap-btn-danger" type="button" data-snap-action="delete">删除</button>'+
                '</div></div></div>';
        }).join('');
    }

    function post(func, payload, done){
        try{
            var body = new URLSearchParams();
            body.set('id', panel.getAttribute('data-service-id')||'');
            body.set('func', func || '');
            Object.keys(payload||{}).forEach(function(k){ body.set(k, payload[k]); });
            fetch(endpoint(),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Authorization':'JWT {$Think.get.jwt}'},credentials:'same-origin',body:body.toString()})
            .then(function(r){return r.text();})
            .then(function(txt){
                var d; try{d=JSON.parse(txt);}catch(e){d={status:'error',msg:'非 JSON 响应: '+txt};}
                if(d.status===200||d.status==='success'){
                    show('success', d.msg||'操作成功');
                    if(d.data && typeof d.data.quota==='number' && quota){ quota.textContent = d.data.quota; }
                    if(done) done(d);
                    load();
                } else {
                    show('error', d.msg||'操作失败');
                }
            })
            .catch(function(e){ show('error', e.message||'请求失败'); });
        }catch(e){ show('error', e.message||'请求失败'); }
    }

    function load(){ post('snapshotList', {}, function(d){ if(d.data && d.data.snapshots){ render(d.data.snapshots); } }); }

    function ask(title, text, cb){
        maskText.textContent = text||'';
        document.getElementById('eyvescloud-snap-modal-title').textContent = title||'确认操作';
        pending = cb;
        mask.style.display='flex';
    }
    function closeMask(){ pending=null; mask.style.display='none'; }

    panel.addEventListener('click', function(ev){
        var b = ev.target.closest('[data-eyvescloud-action]');
        if(b && b.getAttribute('data-eyvescloud-action')==='create'){ post('snapshotCreate', {}); return; }
        var nb = ev.target.closest('[data-snap-action]');
        if(!nb) return;
        var item = nb.closest('.eyvescloud-snap-item');
        if(!item) return;
        var id = item.getAttribute('data-id');
        var action = nb.getAttribute('data-snap-action');
        if(action==='restore'){
            ask('还原快照', '确认将该实例还原到该快照？当前数据将被覆盖。', function(){ post('snapshotRestore', {id:id}); });
        } else {
            ask('删除快照', '确认删除该快照？删除后不可恢复。', function(){ post('snapshotDelete', {id:id}); });
        }
    });

    if(cancelBtn){ cancelBtn.addEventListener('click', closeMask); }
    if(confirmBtn){ confirmBtn.addEventListener('click', function(){ var cb=pending; closeMask(); if(cb) cb(); }); }
    if(mask){ mask.addEventListener('click', function(ev){ if(ev.target===mask) closeMask(); }); }

    load();
})();
</script>
