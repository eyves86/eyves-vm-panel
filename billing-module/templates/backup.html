<style>
.eyvescloud-bak-panel{font-size:14px;color:#1f2937}
.eyvescloud-bak-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.eyvescloud-bak-card{border:1px solid #e5e7eb;border-radius:6px;padding:12px;background:#fff}
.eyvescloud-bak-label{color:#6b7280;font-size:12px;margin-bottom:4px}
.eyvescloud-bak-value{font-size:18px;font-weight:600;word-break:break-all}
.eyvescloud-bak-title{font-weight:600;margin:18px 0 8px}
.eyvescloud-bak-muted{color:#6b7280}
.eyvescloud-bak-form{border:1px solid #e5e7eb;border-radius:6px;background:#fff;padding:12px;margin-top:8px}
.eyvescloud-bak-actions{display:flex;gap:8px;flex-wrap:wrap}
.eyvescloud-bak-btn{height:34px;border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:4px;padding:0 12px;cursor:pointer}
.eyvescloud-bak-btn[disabled]{opacity:.6;cursor:not-allowed}
.eyvescloud-bak-btn-secondary{border-color:#d1d5db;background:#fff;color:#374151}
.eyvescloud-bak-btn-danger{border-color:#dc2626;background:#dc2626;color:#fff}
.eyvescloud-bak-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.eyvescloud-bak-item{border:1px solid #e5e7eb;border-radius:6px;background:#fff;padding:12px}
.eyvescloud-bak-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:center}
.eyvescloud-bak-msg{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:10px 12px;margin-bottom:12px;display:none}
.eyvescloud-bak-msg.error{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
.eyvescloud-bak-modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.eyvescloud-bak-modal{width:min(420px,100%);background:#fff;border-radius:6px;border:1px solid #e5e7eb;box-shadow:0 18px 48px rgba(15,23,42,.22);padding:16px}
.eyvescloud-bak-modal-title{font-size:16px;font-weight:700;color:#111827;margin-bottom:8px}
.eyvescloud-bak-modal-body{font-size:14px;color:#4b5563;line-height:1.6;margin-bottom:14px}
.eyvescloud-bak-modal-actions{display:flex;justify-content:flex-end;gap:8px}
</style>

<div class="eyvescloud-bak-panel" id="eyvescloud-bak-panel" data-service-id="{$service_id}" data-area-key="{$area_key}">
    <div class="eyvescloud-bak-msg" id="eyvescloud-bak-msg"></div>

    <div class="eyvescloud-bak-grid">
        <div class="eyvescloud-bak-card">
            <div class="eyvescloud-bak-label">实例名称</div>
            <div class="eyvescloud-bak-value">{$container_name}</div>
        </div>
    </div>

    <div class="eyvescloud-bak-title">创建备份</div>
    <div class="eyvescloud-bak-form">
        <div class="eyvescloud-bak-actions">
            <button class="eyvescloud-bak-btn" type="button" data-eyvescloud-action="create">创建备份</button>
        </div>
        <div class="eyvescloud-bak-muted" style="margin-top:8px">备份保存当前磁盘的完整副本，可用于灾难恢复。创建/还原可能耗时较久，请耐心等待。</div>
    </div>

    <div class="eyvescloud-bak-title">已有备份</div>
    <div id="eyvescloud-bak-list" class="eyvescloud-bak-list">
        <div class="eyvescloud-bak-form eyvescloud-bak-muted">正在加载…</div>
    </div>

    <div class="eyvescloud-bak-modal-mask" id="eyvescloud-bak-modal-mask">
        <div class="eyvescloud-bak-modal">
            <div class="eyvescloud-bak-modal-title" id="eyvescloud-bak-modal-title">确认操作</div>
            <div class="eyvescloud-bak-modal-body" id="eyvescloud-bak-modal-body"></div>
            <div class="eyvescloud-bak-modal-actions">
                <button class="eyvescloud-bak-btn eyvescloud-bak-btn-secondary" type="button" id="eyvescloud-bak-cancel">取消</button>
                <button class="eyvescloud-bak-btn" type="button" id="eyvescloud-bak-confirm">确认</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    var panel = document.getElementById('eyvescloud-bak-panel');
    if (!panel || panel.getAttribute('data-bound') === '1') return;
    panel.setAttribute('data-bound', '1');

    var msg = document.getElementById('eyvescloud-bak-msg');
    var list = document.getElementById('eyvescloud-bak-list');
    var mask = document.getElementById('eyvescloud-bak-modal-mask');
    var pending = null;
    var maskText = document.getElementById('eyvescloud-bak-modal-body');
    var cancelBtn = document.getElementById('eyvescloud-bak-cancel');
    var confirmBtn = document.getElementById('eyvescloud-bak-confirm');

    function endpoint(){ return "{$MODULE_CUSTOM_API}"; }
    function escapeHtml(v){ return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function show(type, text){ msg.className = 'eyvescloud-bak-msg'+(type==='error'?' error':''); msg.style.display='block'; msg.textContent = text||''; }

    function statusText(s){ s = String(s||'').toLowerCase(); if(s==='succeeded'||s==='completed'||s==='done') return '已完成'; if(s==='running'||s==='pending'||s==='creating') return '进行中'; if(s==='failed'||s==='error') return '失败'; return s||'-'; }

    function render(items){
        if(!Array.isArray(items) || items.length===0){
            list.innerHTML = '<div class="eyvescloud-bak-form eyvescloud-bak-muted">暂无备份</div>';
            return;
        }
        list.innerHTML = items.map(function(b){
            var id = escapeHtml(b.id||'');
            var name = escapeHtml(b.name||b.filename||id);
            var created = escapeHtml(b.created_at||'-');
            var size = escapeHtml(b.size_text||'-');
            var status = escapeHtml(statusText(b.status));
            return '<div class="eyvescloud-bak-item" data-id="'+id+'">'+
                '<div class="eyvescloud-bak-row">'+
                '<div><div class="eyvescloud-bak-label">备份名称</div><div class="eyvescloud-bak-value">'+name+'</div></div>'+
                '<div><div class="eyvescloud-bak-label">创建时间</div><div>'+created+'</div></div>'+
                '<div><div class="eyvescloud-bak-label">大小</div><div>'+size+'</div></div>'+
                '<div><div class="eyvescloud-bak-label">状态</div><div>'+status+'</div></div>'+
                '<div class="eyvescloud-bak-actions">'+
                '<button class="eyvescloud-bak-btn eyvescloud-bak-btn-secondary" type="button" data-bak-action="restore">还原</button>'+
                '<button class="eyvescloud-bak-btn eyvescloud-bak-btn-danger" type="button" data-bak-action="delete">删除</button>'+
                '</div></div></div>';
        }).join('');
    }

    function post(func, payload, done){
        try{
            var body = new URLSearchParams();
            body.set('id', panel.getAttribute('data-service-id')||'');
            body.set('func', func || '');
            Object.keys(payload||{}).forEach(function(k){ body.set(k, payload[k]); });
            fetch(endpoint(),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Authorization':'JWT {$Think.get.jwt}'},credentials:'same-origin',body:body.toString()})
            .then(function(r){return r.text();})
            .then(function(txt){
                var d; try{d=JSON.parse(txt);}catch(e){d={status:'error',msg:'非 JSON 响应: '+txt};}
                if(d.status===200||d.status==='success'){
                    show('success', d.msg||'操作成功');
                    if(done) done(d);
                    load();
                } else {
                    show('error', d.msg||'操作失败');
                }
            })
            .catch(function(e){ show('error', e.message||'请求失败'); });
        }catch(e){ show('error', e.message||'请求失败'); }
    }

    function load(){ post('backupList', {}, function(d){ if(d.data && d.data.backups){ render(d.data.backups); } }); }

    function ask(title, text, cb){
        maskText.textContent = text||'';
        document.getElementById('eyvescloud-bak-modal-title').textContent = title||'确认操作';
        pending = cb;
        mask.style.display='flex';
    }
    function closeMask(){ pending=null; mask.style.display='none'; }

    panel.addEventListener('click', function(ev){
        var b = ev.target.closest('[data-eyvescloud-action]');
        if(b && b.getAttribute('data-eyvescloud-action')==='create'){ post('backupCreate', {}); return; }
        var nb = ev.target.closest('[data-bak-action]');
        if(!nb) return;
        var item = nb.closest('.eyvescloud-bak-item');
        if(!item) return;
        var id = item.getAttribute('data-id');
        var action = nb.getAttribute('data-bak-action');
        if(action==='restore'){
            ask('还原备份', '确认将该实例还原到该备份？当前数据将被覆盖，且还原耗时较长。', function(){ post('backupRestore', {id:id}); });
        } else {
            ask('删除备份', '确认删除该备份？删除后不可恢复。', function(){ post('backupDelete', {id:id}); });
        }
    });

    if(cancelBtn){ cancelBtn.addEventListener('click', closeMask); }
    if(confirmBtn){ confirmBtn.addEventListener('click', function(){ var cb=pending; closeMask(); if(cb) cb(); }); }
    if(mask){ mask.addEventListener('click', function(ev){ if(ev.target===mask) closeMask(); }); }

    load();
})();
</script>
