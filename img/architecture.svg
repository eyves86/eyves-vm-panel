<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="ref" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7180b9"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="920" height="560" rx="16" fill="url(#bg)"/>

  <text x="30" y="42" font-size="24" font-weight="700" fill="#111827">EyvesCloud — 系统架构</text>
  <text x="30" y="64" font-size="13" fill="#6b7280">面向 LXC / KVM 的轻量虚拟化管理面板（主控 - 被控 多节点）</text>

  <!-- Browser layer -->
  <rect x="28" y="88" width="268" height="120" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="44" y="112" font-size="13" font-weight="700" fill="#111827">浏览器 / 运维控制台</text>
  <text x="44" y="132" font-size="11" fill="#4b5563">React · TypeScript · Vite · Tailwind</text>
  <text x="44" y="150" font-size="11" fill="#4b5563">WebSSH (xterm.js) · WebVNC (noVNC)</text>
  <text x="44" y="168" font-size="11" fill="#4b5563">Dashboard · 容器 · 路由 · 审计 · 策略</text>
  <text x="44" y="190" font-size="11" fill="#9ca3af">对外 API：/api/v1（自动化 / 魔方对接）</text>

  <!-- API gateway -->
  <rect x="336" y="88" width="250" height="120" rx="10" fill="#0b1220" stroke="#0b1220"/>
  <text x="352" y="112" font-size="13" font-weight="700" fill="#ffffff">Go 后端 · net/http (内嵌前端)</text>
  <text x="352" y="132" font-size="11" fill="#9ca3af">鉴权：JWT / API Key (argon2id)</text>
  <text x="352" y="150" font-size="11" fill="#9ca3af">限流 · 面板访问策略 · CORS 白名单</text>
  <text x="352" y="168" font-size="11" fill="#9ca3af">任务队列(持久化) · 审计/登录日志</text>
  <text x="352" y="186" font-size="11" fill="#9ca3af">TOTP 两步验证 · 密码策略</text>

  <!-- Data -->
  <rect x="626" y="88" width="266" height="120" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="642" y="112" font-size="13" font-weight="700" fill="#111827">数据与存储</text>
  <text x="642" y="132" font-size="11" fill="#4b5563">SQLite (config.db) · 自动迁移</text>
  <text x="642" y="150" font-size="11" fill="#4b5563">容器 / 子用户 / API Key / 节点</text>
  <text x="642" y="168" font-size="11" fill="#4b5563">审计日志 · 策略 · 指标采样</text>
  <text x="642" y="186" font-size="11" fill="#4b5563">配置备份(容灾) · 租户配额</text>

  <!-- arrows top row -->
  <line x1="298" y1="148" x2="332" y2="148" stroke="#9ca3af" stroke-width="2" marker-end="url(#ah)"/>
  <polygon points="330,142 342,148 330,154" fill="#9ca3af"/>
  <line x1="588" y1="148" x2="622" y2="148" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="620,142 632,148 620,154" fill="#9ca3af"/>

  <text x="460" y="232" font-size="11" font-style="italic" fill="#6b7280" text-anchor="middle">manage · store · read</text>

  <!-- Middle: subsystem modules -->
  <rect x="28" y="252" width="278" height="128" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="44" y="276" font-size="13" font-weight="700" fill="#111827">虚拟化运行时</text>
  <text x="44" y="296" font-size="11" fill="#4b5563">LXC 容器 · KVM/libvirt 虚拟机</text>
  <text x="44" y="314" font-size="11" fill="#4b5563">创建 / 重装 / 开关机 / 重置密码</text>
  <text x="44" y="332" font-size="11" fill="#4b5563">快照 · 计划快照 · 到期/流量超额关机</text>
  <text x="44" y="350" font-size="11" fill="#4b5563">Cloud-init · cgroup v2 资源限制</text>

  <rect x="336" y="252" width="250" height="128" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="352" y="276" font-size="13" font-weight="700" fill="#111827">网络与安全</text>
  <text x="352" y="296" font-size="11" fill="#4b5563">NAT4 端口映射 · 公网 IPv4 池</text>
  <text x="352" y="314" font-size="11" fill="#4b5563">IPv6 前缀检测 / 分配</text>
  <text x="352" y="332" font-size="11" fill="#4b5563">容器防火墙 · ARP 防护</text>
  <text x="352" y="350" font-size="11" fill="#4b5563">conntrack 安全引擎 · 告警推送</text>

  <rect x="626" y="252" width="266" height="128" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="642" y="276" font-size="13" font-weight="700" fill="#111827">策略 / 可观测性</text>
  <text x="642" y="296" font-size="11" fill="#4b5563">策略引擎：CPU / 内存 / 带宽 / IO 触发</text>
  <text x="642" y="314" font-size="11" fill="#4b5563">动作：调核 / 调内存 / 调带宽 / 关机</text>
  <text x="642" y="332" font-size="11" fill="#4b5563">30s 指标采样 · 历史趋势</text>
  <text x="642" y="350" font-size="11" fill="#4b5563">健康探针 · 运行时指标 · OpenAPI 契约</text>

  <!-- bottom: controller-agent -->
  <rect x="28" y="416" width="864" height="118" rx="12" fill="#0b1220"/>
  <text x="48" y="444" font-size="14" font-weight="700" fill="#ffffff">主控 - 被控多节点</text>

  <rect x="60" y="462" width="240" height="56" rx="8" fill="#111f3d" stroke="#334155"/>
  <text x="76" y="486" font-size="12" font-weight="700" fill="#e2e8f0">主控 Controller</text>
  <text x="76" y="504" font-size="10" fill="#94a3b8">/api/nodes · 生成一键安装脚本 · 代理访问</text>

  <rect x="352" y="466" width="260" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="482" y="492" font-size="11" fill="#94a3b8" text-anchor="middle">注册 + 10s 心跳（节点 token）</text>

  <rect x="652" y="462" width="220" height="56" rx="8" fill="#111f3d" stroke="#334155"/>
  <text x="668" y="486" font-size="12" font-weight="700" fill="#e2e8f0">被控 Agent</text>
  <text x="668" y="504" font-size="10" fill="#94a3b8">eyvescloud agent · /api/agent/*</text>

  <line x1="302" y1="490" x2="350" y2="490" stroke="#475569" stroke-width="2"/>
  <polygon points="348,484 360,490 348,496" fill="#475569"/>
  <line x1="612" y1="490" x2="650" y2="490" stroke="#475569" stroke-width="2"/>
  <polygon points="648,484 660,490 648,496" fill="#475569"/>

  <text x="48" y="516" font-size="10" fill="#64748b">母面板直接查看 / 操作被控容器（含重置密码），无需逐个登录被控。</text>
</svg>